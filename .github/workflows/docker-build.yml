name: docker-build

# Build the Docker image and push it to GitHub Container Registry (GHCR).
# - On push to main/dev and on version tags (v*), build + push.
#   main -> :main, dev -> :dev (test image), tag -> :X.Y.Z (release image), plus :sha-<short>.
# - On pull requests, build only (no push) as a sanity check.
# Gates: the `build` job depends on tests, then builds the exact runtime image locally and
# blocks on a High/Critical Trivy scan before logging in or pushing. Tags have no branch
# protection, so these in-workflow gates are what stop a bad release image from being published.

on:
  push:
    branches: ["main", "dev"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "dev"]

env:
  IMAGE_NAME: ${{ github.repository }} # e.g. yl0711-coder/API-evaluator -> ghcr.io/yl0711-coder/api-evaluator

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm rebuild esbuild
      - run: node --check server.mjs
      - run: node_modules/.bin/biome ci .
      - run: node --test tests/*.test.mjs

  build:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: api-evaluator:ci-security-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pin the immutable commit behind trivy-action v0.36.0. Do not replace this with a
      # movable tag: the Trivy Actions ecosystem had a tag-compromise incident in 2026.
      - name: Scan final runtime image (High/Critical gate)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: api-evaluator:ci-security-scan
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
