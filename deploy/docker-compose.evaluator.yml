# API-evaluator — docker-compose for self-hosting.
# 要点：不映射宿主端口（仅在 docker 网络内暴露给反向代理）、mem/cpu 安全带、独立网络、/data 卷。
# 启动（先在构建机/CI 构建镜像，再运行）：
#   docker compose --env-file .env.evaluator -f deploy/docker-compose.evaluator.yml up -d --no-build evaluator
x-evaluator-image: &evaluator-image api-evaluator:0.7.5

services:
  # v0.7.0 之前的镜像以 root 运行，已有 evaluator-data 卷及其 SQLite/配置/报告文件通常属于 0:0。
  # 新镜像改用 node(1000:1000)；先用一次性、无网络的最小迁移容器修正这个卷的属主，成功后才启动主服务。
  # 它不挂 docker.sock、不挂其他卷，执行完即退出；新装空卷同样安全。
  data-permissions:
    image: *evaluator-image
    container_name: api-evaluator-data-permissions
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    restart: "no"
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    volumes:
      - evaluator_data:/data
    mem_limit: 64m

  evaluator:
    # build 段供构建机 / CI 用。在资源紧张的小机上建议在别处构建
    #   （docker build -> docker save -> scp -> docker load），再 `up -d --no-build` 运行：
    #   下方 mem_limit/cpus 只约束运行时容器，**管不到 build 过程**，本地编译可能打满 CPU 拖垮整机。
    build:
      context: ..
      dockerfile: Dockerfile
    image: *evaluator-image
    container_name: api-evaluator
    restart: unless-stopped
    depends_on:
      data-permissions:
        condition: service_completed_successfully
    # 不映射宿主端口：只经反向代理在 docker 网络内访问，缩小暴露面
    expose:
      - "5180"
    env_file:
      - ../.env.evaluator
    environment:
      HOST: "0.0.0.0"
      PORT: "5180"
      EVALUATOR_DATA_DIR: "/data"
    volumes:
      - evaluator_data:/data
    # 资源安全带：cgroup 硬限制——超限只会本容器被 OOM kill，不会拖垮宿主或同机其它服务。
    # 这是小机（如 2 vCPU / 2 GB）上的保守起步值（评测本身轻，几百 MB 足够）；压测取峰值后再定死。
    # 小机另可设 EVALUATOR_MAX_CONCURRENT_TASKS=2 / EVALUATOR_OFFLINE_TOKENIZER=off（见 README）。
    mem_limit: 512m
    cpus: "0.75"
    # 健康检查同时校验 HTTP 存活与调度器活性：autoTest.stale=true（心跳超时=定时器僵死）也判 unhealthy。
    # 宿主机侧的 systemd timer 会据此重启固定容器，见 deploy/api-evaluator-health-recovery.*。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5180/api/health').then(async r=>{const j=await r.json().catch(()=>({}));process.exit(r.ok&&!(j.autoTest&&j.autoTest.stale)?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - evaluator_net

# 独立 docker 网络。把你的反向代理加入本网络（或把本服务接入反代所在网络），
# 才能用容器名 evaluator:5180 反代。
networks:
  evaluator_net:
    name: evaluator-net
    driver: bridge

volumes:
  evaluator_data:
    name: evaluator-data
